<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/estilos/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="/estilos/media-queries.css" media="all">

</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem vindo ao ambiente de trabalho, faça login com sua conta para prosseguir</p>
            <form action="login.php" method="post" autocomplete="on">
                <div class="campo">
                    <span class="material-symbols-outlined"><label for="iemail"></label>account_circle</span>
                    <input type="email" name="email" id="iemail" class="resposta" placeholder="Digite seu Email" required>
                    <label for="iemail">Login</label>
                </div>
                <div class="campo">
                    <span class="material-symbols-outlined" style="display: inline-block;"><label for="isen"></label>key</span>
                    <input type="password" name="sen" id="isen" minlength="8" class="resposta" placeholder="Digite sua senha" required>
                    <label for="isen">Senha</label>
                </div>
                <input type="submit" value="Entrar" id="ientrar">
                <a href="esqueci.html" class="botao">
                    Esqueci minha senha
                </a>
                    </form>
            </div>
        </section>
    </main>
</body>
</html>
